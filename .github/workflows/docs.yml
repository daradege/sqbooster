name: Generate and Deploy Docs

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install pdoc
      run: pip install pdoc

    - name: Generate documentation
      run: pdoc sqbooster --output-dir docs --docformat google

    - name: Set up SSH for deploy key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Push to sqbooster/docs
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git clone git@github.com:sqbooster/docs.git out
        rm -rf out/*
        cp -r docs/* out/
        cd out
        touch .nojekyll
        git add .
        git commit -m "Update docs from sqbooster" || echo "No changes to commit"
        git push
